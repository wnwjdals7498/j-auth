name: j-auth

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?Set this only in the external runtime env file}"
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set this only in the external runtime env file}"
      JAUTH_DB_PASSWORD: "${JAUTH_DB_PASSWORD:?Set this only in the external runtime env file}"
    ports:
      - target: 5432
        published: "${PG_HOST_PORT:-54230}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: "${J_AUTH_RUNTIME_DIR:?Set an absolute runtime directory outside the checkout}/postgres"
        target: /var/lib/postgresql
      - type: bind
        source: ./postgres/init-control-plane-databases.sh
        target: /docker-entrypoint-initdb.d/010-create-control-plane-databases.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:?Set this only in the external runtime env file}"
      KC_HOSTNAME: "${KC_PUBLIC_URL:?Set the fixed HTTPS public URL}"
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_MANAGEMENT_SCHEME: inherited
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:?Set a local bootstrap username outside the checkout}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set this only in the external runtime env file}"
    ports:
      - target: 8443
        published: "${KC_HTTPS_HOST_PORT:-8443}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9000
        published: "${KC_MANAGEMENT_HOST_PORT:-9000}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: "${J_AUTH_RUNTIME_DIR:?Set an absolute runtime directory outside the checkout}/tls"
        target: /opt/keycloak/conf/tls
        read_only: true
